[build-system]
requires = ["setuptools>=67", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tiny-can-ids"
version = "0.1.0"
description = "TinyML-based CAN bus intrusion detection system"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "tensorflow>=2.13",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
can-ids-pipeline = "scripts.run_pipeline:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
