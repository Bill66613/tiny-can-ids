name: Build C source

on:
  push:
    branches: [nam]
jobs:
  build-source-c:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build C source with Makefile
        id: build
        shell: bash
        run: |
          if [ -d source_c ]; then
            SRC_DIR=source_c
          else
            echo "::error::Could not find source_c directory"
            exit 1
          fi

          echo "SRC_DIR=$SRC_DIR" >> $GITHUB_OUTPUT
          echo "Building in ./$SRC_DIR"
          make -C "$SRC_DIR"
          test -f "$SRC_DIR/build/can_test_app"

      - name: Smoke test — print help and run example
        shell: bash
        run: |
          BIN=source_c/build/can_test_app
          echo "=== --help ==="
          "$BIN" --help

          echo "=== example: dos / tnn / vcan0 ==="
          "$BIN" --attack-type dos --model tnn --interface vcan0

      - name: Upload build directory as artifact
        uses: actions/upload-artifact@v6
        with:
          name: output-c
          path: ${{ steps.build.outputs.SRC_DIR }}/build/
          retention-days: 7
          if-no-files-found: error
          compression-level: 6
          overwrite: true