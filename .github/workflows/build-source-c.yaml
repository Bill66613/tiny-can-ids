name: Build C source

on:
  push:
    branches: [nam]
jobs:
  build-source-c:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build C source with Makefile
        id: build
        shell: bash
        run: |
          if [ -d source_c ]; then
            SRC_DIR=source_c
          else
            echo "::error::Could not find source_c directory"
            exit 1
          fi

          echo "SRC_DIR=$SRC_DIR" >> $GITHUB_OUTPUT
          echo "Building in ./$SRC_DIR"
          make -C "$SRC_DIR"
          test -f "$SRC_DIR/build/can_test_app"

      - name: Smoke test — print help and run example
        shell: bash
        run: |
          BIN=source_c/build/can_test_app
          echo "=== --help ==="
          "$BIN" --help

      - name: Upload build directory as artifact
        uses: actions/upload-artifact@v4
        with:
          name: output-c
          path: ${{ steps.build.outputs.SRC_DIR }}/build/
          retention-days: 7
          if-no-files-found: error
          compression-level: 6
          overwrite: true

  can-attack-sim:
    runs-on: ubuntu-latest
    needs: build-source-c
    steps:
      - uses: actions/checkout@v5

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: output-c
          path: source_c/build

      - name: Make binary executable
        run: chmod +x source_c/build/can_test_app

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install python-can

      - name: Set up virtual CAN interface
        run: |
          sudo apt-get update
          sudo apt-get install -y linux-modules-extra-$(uname -r)
          sudo modprobe vcan
          sudo ip link add dev vcan0 type vcan
          sudo ip link set up vcan0
          ip link show vcan0

      - name: Install can-utils
        run: sudo apt-get install -y can-utils

      - name: Run binary smoke test on vcan0
        run: |
          BIN=source_c/build/can_test_app
          echo "=== --help ==="
          "$BIN" --help

          echo "=== example: dos / dt / vcan0 ==="
          "$BIN" --attack-type dos --model dt --interface vcan0 --timeout 5

      - name: Tear down virtual CAN
        if: always()
        run: |
          sudo ip link set down vcan0 || true
          sudo ip link delete vcan0 || true