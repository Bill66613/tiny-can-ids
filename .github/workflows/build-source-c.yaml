name: Build C source

on:
  push:
    branches: [nam]

env:
  SRC_DIR: source_c

jobs:
  build-source-c:
    runs-on: ubuntu-latest
    outputs:
      SRC_DIR: ${{ steps.build.outputs.SRC_DIR }}
    steps:
      - uses: actions/checkout@v5

      - name: Install cross-compilers
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabihf

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Generate main.c from template
        run: python ${{ env.SRC_DIR }}/gen_main.py

      - name: Build C source with Makefile (multi-arch)
        id: build
        shell: bash
        run: |
          if [ -d "${SRC_DIR}" ]; then
            SRC_DIR="${SRC_DIR}"
          else
            echo "::error::Could not find ${SRC_DIR} directory"
            exit 1
          fi

          echo "SRC_DIR=$SRC_DIR" >> $GITHUB_OUTPUT
          echo "Building all architectures in ./$SRC_DIR"
          make -C "$SRC_DIR" multi
          test -f "$SRC_DIR/build/native/can_test_app"
          test -f "$SRC_DIR/build/aarch64/can_test_app"
          test -f "$SRC_DIR/build/armv7/can_test_app"

      - name: Show binary sizes
        shell: bash
        run: |
          echo "=== Binary sizes ==="
          file ${{ env.SRC_DIR }}/build/native/can_test_app
          file ${{ env.SRC_DIR }}/build/aarch64/can_test_app
          file ${{ env.SRC_DIR }}/build/armv7/can_test_app
          ls -lh ${{ env.SRC_DIR }}/build/*/can_test_app

      - name: Smoke test — native binary
        shell: bash
        run: |
          BIN=${{ env.SRC_DIR }}/build/native/can_test_app
          echo "=== --help ==="
          "$BIN" --help

      - name: Stage generated sources
        run: |
          mkdir -p ${{ env.SRC_DIR }}/src-gen
          cp ${{ env.SRC_DIR }}/src/main.c ${{ env.SRC_DIR }}/src-gen/main.c

      - name: Upload build directory as artifact
        uses: actions/upload-artifact@v6
        with:
          name: can-ids-binaries
          path: |
            ${{ steps.build.outputs.SRC_DIR }}/build/native/can_test_app
            ${{ steps.build.outputs.SRC_DIR }}/build/aarch64/can_test_app
            ${{ steps.build.outputs.SRC_DIR }}/build/armv7/can_test_app
            ${{ steps.build.outputs.SRC_DIR }}/src-gen/main.c
          retention-days: 2
          if-no-files-found: error
          compression-level: 6
          overwrite: true

  can-attack-sim:
    runs-on: ubuntu-latest
    needs: build-source-c
    steps:
      - uses: actions/checkout@v5

      - name: Download build artifact
        uses: actions/download-artifact@v6
        with:
          name: can-ids-binaries
          path: ${{ needs.build-source-c.outputs.SRC_DIR }}

      - name: List downloaded files
        run: find . -type f

      - name: Make binary executable
        run: chmod +x ${{ needs.build-source-c.outputs.SRC_DIR }}/build/native/can_test_app

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install python-can

      - name: Set up virtual CAN interface
        run: |
          sudo apt-get update
          sudo apt-get install -y linux-modules-extra-$(uname -r)
          sudo modprobe vcan
          sudo ip link add dev vcan0 type vcan
          sudo ip link set up vcan0
          ip link show vcan0

      - name: Install can-utils
        run: sudo apt-get install -y can-utils

      - name: Run binary smoke test on vcan0
        run: |
          BIN=${{ needs.build-source-c.outputs.SRC_DIR }}/build/native/can_test_app
          echo "=== --help ==="
          "$BIN" --help

          echo "=== example: dos / dt / vcan0 ==="
          "$BIN" --attack-type dos --model dt --interface vcan0 --timeout 5

      - name: Tear down virtual CAN
        if: always()
        run: |
          sudo ip link set down vcan0 || true
          sudo ip link delete vcan0 || true