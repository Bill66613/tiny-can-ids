name: Build C source

on:
  push:
    branches: [nam]
jobs:
  build-source-c:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build C source with Makefile
        shell: bash
        run: |
          if [ -d source_c ]; then
            SRC_DIR=source_c
          else
            echo "::error::Could not find source_c directory"
            exit 1
          fi

          echo "SRC_DIR=$SRC_DIR" >> $GITHUB_OUTPUT
          echo "Building in ./$SRC_DIR"
          make -C "$SRC_DIR"
          test -f "$SRC_DIR/can_test_app"

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: output-c
          path: ${{ steps.build.outputs.SRC_DIR }}/can_test_app
          retention-days: 1