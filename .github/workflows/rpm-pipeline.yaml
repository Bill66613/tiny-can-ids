name: TinyML DoS Pipeline

on:
  workflow_call:
  workflow_dispatch:

jobs:
  generate-and-upload-models:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Download Dataset from Dropbox
        run: |
          mkdir -p dataset
          echo "Downloading RPM_dataset.csv..."
          wget -O dataset/RPM_dataset.csv "https://www.dropbox.com/scl/fo/9rwsf9pclhvv9xxloojom/AOyhvxvDP-I8aMo05PPyLxw/RPM_dataset.csv?rlkey=3h6zamu3kc262lrnipu5qden8&e=1&dl=1"

      - name: Run RPM Pipeline
        run: |
          echo "Running pipeline to generate models..."
          python -m scripts.run_pipeline --dataset dataset/RPM_dataset.csv --export-model dt --window-size 50

      - name: Upload Generated C Models
        uses: actions/upload-artifact@v6
        with:
          name: output-c-rpm
          path: output/rpm_only/
          retention-days: 1
          if-no-files-found: error