name: TinyML DoS Pipeline

on:
  workflow_call:
  workflow_dispatch:

jobs:
  generate-and-upload-models:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Download Dataset from Dropbox
        run: |
          mkdir -p dataset
          echo "Downloading DoS_dataset.csv..."
          wget -O dataset/DoS_dataset.csv "https://www.dropbox.com/scl/fo/9rwsf9pclhvv9xxloojom/AFCn22TGN0tRVpNMDCq2F2Y/DoS_dataset.csv?rlkey=3h6zamu3kc262lrnipu5qden8&e=1&dl=1"

      - name: Run DoS Pipeline
        run: |
          echo "Running pipeline to generate models..."
          python -m scripts.run_pipeline --dataset dataset/DoS_dataset.csv --export-model dt --window-size 50
          python -m scripts.run_pipeline --dataset dataset/DoS_dataset.csv --export-model tnn --window-size 50 --tflite

      - name: Upload Generated C Models
        uses: actions/upload-artifact@v4
        with:
          name: output-c
          path: output/dos_only/
          retention-days: 7
          if-no-files-found: error