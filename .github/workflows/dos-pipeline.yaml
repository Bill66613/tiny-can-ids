name: TinyML DoS Pipeline 

on:
  push:
    branches: [ feature/#20-train-dos-model ]

jobs:
  generate-and-upload-models:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip' 

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run DoS Pipeline
        run: |
          echo "Running pipeline to generate models..."
          python -m  scripts.run_pipeline --mode dos_only --dataset dataset/DoS_dataset.csv --window-size 50

      - name: Upload Generated C Models
        uses: actions/upload-artifact@v4
        with:
          name: output-c
          path: output/dos_only/
          retention-days: 7 
          if-no-files-found: error 