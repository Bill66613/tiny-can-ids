name: CAN Attack Simulator Smoke Test

on:
  workflow_dispatch:

jobs:
  can-attack-sim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install python-can

      - name: Set up virtual CAN interface
        run: |
          sudo apt-get update
          # Install the extra kernel modules matching the active kernel version
          sudo apt-get install -y linux-modules-extra-$(uname -r)

          # Now load the module and setup the interface
          sudo modprobe vcan
          sudo ip link add dev vcan0 type vcan
          sudo ip link set up vcan0
          ip link show vcan0

      - name: Install can-utils
        run: sudo apt-get install -y can-utils

      - name: Test — interface discovery
        run: |
          printf 'q\n' | python tests/simulation/can_attack_sim.py 2>&1 | grep -q "vcan0"
          echo "OK: vcan0 listed in interface menu"

      - name: Create normal CAN CSV if not exist
        run: |
          FILE=tests/simulation/normal.csv
          if [ -f $FILE ]; then
            echo "$FILE already exists, skipping creation."
          else
            echo "Creating $FILE with sample normal CAN traffic..."
            cat > $FILE << 'EOF'
          1478198377.185137,0100,8,11,22,33,44,55,66,77,88,R
          1478198377.185629,0200,8,AA,BB,CC,DD,EE,FF,00,11,R
          1478198377.186119,0300,8,01,02,03,04,05,06,07,08,R
          1478198377.186612,0400,8,10,20,30,40,50,60,70,80,R
          EOF
            echo "Created $FILE"
            cat $FILE
          fi

      - name: Test — DoS attack (100 frames) (default normal can traffic)
        run: |
          candump vcan0 > /tmp/candump.log 2>&1 & echo $! > /tmp/candump.pid
          printf '1\n1\n100\n\nq\n' | python tests/simulation/can_attack_sim.py
          kill $(cat /tmp/candump.pid) 2>/dev/null || true
          echo "=== candump: DoS ===" && cat /tmp/candump.log
          truncate -s 0 /tmp/candump.log

      - name: Test — DoS attack (100 frames) (csv normal can traffic)
        run: |
          candump vcan0 > /tmp/candump.log 2>&1 & echo $! > /tmp/candump.pid
          printf '1\n1\n100\ntests/simulation/normal.csv\nq\n' | python tests/simulation/can_attack_sim.py
          kill $(cat /tmp/candump.pid) 2>/dev/null || true
          echo "=== candump: DoS ===" && cat /tmp/candump.log
          truncate -s 0 /tmp/candump.log

      - name: Test — Fuzzy attack (100 frames) (default normal can traffic)
        run: |
          candump vcan0 > /tmp/candump.log 2>&1 & echo $! > /tmp/candump.pid
          printf '1\n2\n100\n\nq\n' | python tests/simulation/can_attack_sim.py
          kill $(cat /tmp/candump.pid) 2>/dev/null || true
          echo "=== candump: Fuzzy ===" && cat /tmp/candump.log
          truncate -s 0 /tmp/candump.log

      - name: Test — Fuzzy attack (100 frames) (csv normal can traffic)
        run: |
          candump vcan0 > /tmp/candump.log 2>&1 & echo $! > /tmp/candump.pid
          printf '1\n2\n100\ntests/simulation/normal.csv\nq\n' | python tests/simulation/can_attack_sim.py
          kill $(cat /tmp/candump.pid) 2>/dev/null || true
          echo "=== candump: Fuzzy ===" && cat /tmp/candump.log
          truncate -s 0 /tmp/candump.log

      - name: Test — Gear spoofing (100 frames) (default normal can traffic)
        run: |
          candump vcan0 > /tmp/candump.log 2>&1 & echo $! > /tmp/candump.pid
          printf '1\n3\n100\n\nq\n' | python tests/simulation/can_attack_sim.py
          kill $(cat /tmp/candump.pid) 2>/dev/null || true
          echo "=== candump: Gear ===" && cat /tmp/candump.log
          truncate -s 0 /tmp/candump.log

      - name: Test — Gear spoofing (100 frames) (csv normal can traffic)
        run: |
          candump vcan0 > /tmp/candump.log 2>&1 & echo $! > /tmp/candump.pid
          printf '1\n3\n100\ntests/simulation/normal.csv\nq\n' | python tests/simulation/can_attack_sim.py
          kill $(cat /tmp/candump.pid) 2>/dev/null || true
          echo "=== candump: Gear ===" && cat /tmp/candump.log
          truncate -s 0 /tmp/candump.log

      - name: Test — RPM spoofing (100 frames) (default normal can traffic)
        run: |
          candump vcan0 > /tmp/candump.log 2>&1 & echo $! > /tmp/candump.pid
          printf '1\n4\n100\n\nq\n' | python tests/simulation/can_attack_sim.py
          kill $(cat /tmp/candump.pid) 2>/dev/null || true
          echo "=== candump: RPM ===" && cat /tmp/candump.log
          truncate -s 0 /tmp/candump.log

      - name: Test — RPM spoofing (100 frames) (csv normal can traffic)
        run: |
          candump vcan0 > /tmp/candump.log 2>&1 & echo $! > /tmp/candump.pid
          printf '1\n4\n100\ntests/simulation/normal.csv\nq\n' | python tests/simulation/can_attack_sim.py
          kill $(cat /tmp/candump.pid) 2>/dev/null || true
          echo "=== candump: RPM ===" && cat /tmp/candump.log
          truncate -s 0 /tmp/candump.log

      - name: Test — Manual hand input
        run: |
          candump vcan0 > /tmp/candump.log 2>&1 & echo $! > /tmp/candump.pid
          printf '1\n5\n1\n043F 01 45 60 FF 6B 00 00 00\nrepeat 5 0.001\nrepeat abc\n0316 45 29 24 FF 29 24 00 FF\ndone\nq\n' | python tests/simulation/can_attack_sim.py
          kill $(cat /tmp/candump.pid) 2>/dev/null || true
          echo "=== candump: Manual ===" && cat /tmp/candump.log
          truncate -s 0 /tmp/candump.log

      - name: Test — Manual CSV replay
        run: |
          cat > /tmp/test_attack.csv << 'EOF'
          1478198377.185137,0000,8,00,00,00,00,00,00,00,00,T
          1478198377.185629,0000,8,00,00,00,00,00,00,00,00,T
          1478198377.186119,043f,8,01,45,60,ff,6b,00,00,00,T
          1478198377.186612,0316,8,45,29,24,ff,29,24,00,ff,T
          1478198377.187116,02fd,8,3f,bd,68,f3,c3,4f,28,d4,T
          1478198377.188000,0100,8,aa,bb,cc,dd,ee,ff,00,11,R
          EOF
          candump vcan0 > /tmp/candump.log 2>&1 & echo $! > /tmp/candump.pid
          printf '1\n5\n2\n/tmp/test_attack.csv\nb\ny\n0\nq\n' | python tests/simulation/can_attack_sim.py
          kill $(cat /tmp/candump.pid) 2>/dev/null || true
          echo "=== candump: CSV Replay ===" && cat /tmp/candump.log
          truncate -s 0 /tmp/candump.log

      - name: Tear down virtual CAN
        if: always()
        run: |
          sudo ip link set down vcan0 || true
          sudo ip link delete vcan0 || true
