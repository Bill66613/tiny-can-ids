name: CI

on:
  push:
    branches: [main, develop, nam]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest tests/ -v --tb=short

  pipeline-smoke:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run pipeline with synthetic data
        run: python -m scripts.run_pipeline --output-dir output/ --window-size 20 --epochs 3

      - name: Verify output artifacts
          run: |
            missing=0

            for f in \
              output/tiny_ids_model.tflite \
              output/tiny_ids_weights.h \
              output/tiny_ids_inference.c
            do
              if [ ! -f "$f" ]; then
                echo "::error::Missing artifact: $f"
                missing=1
              else
                echo "OK: $f"
              fi
            done

            if [ "$missing" -ne 0 ]; then
              echo "Generated files in workspace:"
              find . -maxdepth 3 -type f | sort
              exit 1
            fi

            echo "All output artifacts generated successfully"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-output
          path: output/
          retention-days: 7
