name: CI

on:
  push:
    branches: [main, develop, nam]
  pull_request:
    branches: [main, develop]

jobs:
  build-source-c:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build C source with Makefile
        shell: bash
        run: |
          if [ -d source_c ]; then
            SRC_DIR=source_c
          elif [ -d srouce_c ]; then
            SRC_DIR=srouce_c
          else
            echo "::error::Could not find source_c or srouce_c directory"
            exit 1
          fi

          echo "Building in ./$SRC_DIR"
          make -C "$SRC_DIR"
          test -f "$SRC_DIR/can_test_app"

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest tests/ -v --tb=short

  pipeline-smoke:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run pipeline with synthetic data
        run: python -m scripts.run_pipeline --output-dir output/ --window-size 20 --epochs 3

      - name: Verify output artifacts
        run: |
          missing=0

          shopt -s nullglob

          patterns=(
            "./output/tiny_ids_*.tflite"
            "./output/tiny_ids_*.c"
            "./output/tiny_ids_*.h"
          )

          for pattern in "${patterns[@]}"; do
            files=($pattern)

            if [ ${#files[@]} -eq 0 ]; then
              echo "::error::No files match pattern: $pattern"
              missing=1
              continue
            fi

            for f in "${files[@]}"; do
              if test -f "$f"; then
                echo "OK: $f"
              else
                echo "::error::Missing: $f"
                missing=1
              fi
            done
          done

          if [ "$missing" -ne 0 ]; then
            echo "Generated files in output/:"  
            if test -d ./output; then  
              find ./output -maxdepth 2 -type f | sort  
            else  
              echo "::error::output/ directory does not exist"  
            fi  
            exit 1
          fi

          echo "All output artifacts generated successfully"

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: pipeline-output
          path: output/
          retention-days: 7