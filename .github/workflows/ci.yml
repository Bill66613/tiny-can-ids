name: CI

on:
  push:
    branches: [main, develop, "lu13hc/test_document", "lhb2hc/test_pipeline"]
  pull_request:
    branches: [main, develop, "lu13hc/test_document"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-

      - name: Cache Performance Baseline
        uses: actions/cache@v4
        with:
          path: .perf_cache # Folder have file active_baseline.json
          # A unique key for each run allows GitHub to save the latest version.
          key: perf-${{ runner.os }}-${{ matrix.python-version }}-${{ github.run_id }}
          # If the key is not found, GitHub will retrieve the nearest version with that prefix.
          restore-keys: |
            perf-${{ runner.os }}-${{ matrix.python-version }}-
            perf-${{ runner.os }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        env: 
          # Declare to Python where the cache directory is located
          PERF_BASELINE_DIR: .perf_cache
        run: pytest tests/ -v --tb=short

  pipeline-smoke:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run pipeline with synthetic data
        run: python -m scripts.run_pipeline --output-dir output/ --window-size 20 --epochs 3

      - name: Verify output artifacts
        run: |
          test -f output/tiny_ids_model.tflite
          test -f output/tiny_ids_weights.h
          test -f output/tiny_ids_inference.c
          echo "All output artifacts generated successfully"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-output
          path: output/
          retention-days: 7
