# pytest.ini
[pytest]
markers =
    unit: Unit tests (isolated functions)
    integration: Integration tests (full pipeline)
    integration_tiny: Fast integration test (< 5s)
    integration_small: Standard integration test (~10s)
    integration_medium: Full validation test (~30s)
    integration_large: Stress test (> 60s)
    performance: Performance and memory profiling tests
    slow: Tests that take more than 10 seconds